        - "packages/auto-researcher/tsconfig.json"
        - "packages/auto-researcher/src/index.ts"
        - "packages/shared-types/src/index.ts"
        - "packages/mcp-server/package.json"
        - "packages/mcp-server/src/index.ts"
        - "packages/shared-types/dist/**"
        - "packages/auto-researcher/dist/**"
        - "pnpm-lock.yaml"
        - "README.md"
        - "skills/motion-mcp/SKILL.md"
      t004_verify:
        - "/opt/homebrew/bin/node node_modules/typescript/bin/tsc -p packages/shared-types/tsconfig.json --noEmit"
        - "/opt/homebrew/bin/node node_modules/typescript/bin/tsc -p packages/auto-researcher/tsconfig.json --noEmit"
        - "/opt/homebrew/bin/node node_modules/typescript/bin/tsc -p packages/mcp-server/tsconfig.json --noEmit"
      t005_objective: "Add tests and smoke checks proving source normalization, opportunity ranking, context-pack construction, JSON persistence, and local MCP/HTTP behavior."
      t005_allowed_files:
        - "tests/auto-researcher.test.ts"
        - "tests/*.test.ts"
        - "packages/auto-researcher/src/index.ts"
        - "packages/shared-types/src/index.ts"
        - "packages/mcp-server/src/index.ts"
        - "packages/mcp-server/dist/**"
      t005_verify:
        - "/opt/homebrew/bin/node --test --import tsx tests/*.test.ts"
        - "/opt/homebrew/bin/node node_modules/typescript/bin/tsc -p packages/auto-researcher/tsconfig.json --noEmit"
        - "/opt/homebrew/bin/node node_modules/typescript/bin/tsc -p packages/mcp-server/tsconfig.json --noEmit"
      stop_if:
        - "Need network or live GitHub/API calls at runtime."
        - "Need production credentials or paid hosted backend."
        - "Need to alter app emitters beyond type-compatible integration."

  - id: T004
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement @motion-mcp/auto-researcher with a curated source catalog, source-backed findings, ranked local opportunities, context-pack output, .motion-mcp/auto-research.json persistence, and an MCP/HTTP tool named auto_research_motion."
    allowed_files:
