      result: done
      completed_at: "2026-06-10T00:00:00.000Z"
      decision: approved
      summary: "Approved the largest safe local slice: a new auto-researcher package plus shared types, MCP/HTTP wiring, and docs. This directly addresses the oracle by making source-backed research executable as a local MCP workflow instead of a static report."
      rationale:
        - "T001 found no existing auto-research/context-pack package and identified mcp-server as the primary integration seam."
        - "T002 found the best category wedge: Rive-like contracts plus source-backed context packs for AI coding agents."
        - "The slice is local/mockable and avoids hosted crawling, paid APIs, credentials, Supabase, Stripe, and production infrastructure."
      t004_objective: "Implement @motion-mcp/auto-researcher with a curated source catalog, source-backed findings, ranked local opportunities, context-pack output, .motion-mcp/auto-research.json persistence, and an MCP/HTTP tool named auto_research_motion."
      t004_allowed_files:
